[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tribunal"
version = "0.1.0"
description = "Adversarial verification for AI-written code."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "anthropic>=0.40",
  "cryptography>=43",
  "fastapi>=0.115",
  "httpx>=0.27",
  "mcp>=1.2,<2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "tree-sitter>=0.23",
  "tree-sitter-python>=0.23",
  "typer>=0.12",
  "uvicorn>=0.30",
]

[project.scripts]
tribunal = "tribunal.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/tribunal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["docker: requires a running Docker daemon"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/tribunal/agents/*.py" = ["E501"]
